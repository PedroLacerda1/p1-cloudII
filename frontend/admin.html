<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>⚙️ Painel Administrativo</h1>
  <nav>
    <a href="index.html">Loja</a>
    <a href="cliente.html">Minha Conta</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<main>
  <div class="tabs">
    <button onclick="mostrarTab('produtos')">Produtos</button>
    <button onclick="mostrarTab('clientes')">Clientes</button>
    <button onclick="mostrarTab('pedidos')">Pedidos</button>
  </div>

  <section id="tab-produtos">
    <h2>Cadastrar / Editar Produto</h2>
    <form id="formProduto">
      <input type="hidden" id="produtoRowKey">
      <input id="pMarca" placeholder="Marca" required>
      <input id="pModelo" placeholder="Modelo" required>
      <input id="pValor" type="number" step="0.01" placeholder="Valor" required>
      <input id="pQuantidade" type="number" placeholder="Quantidade" required>
      <input id="pFoto" type="file" accept="image/*">
      <button type="submit">Salvar Produto</button>
      <button type="button" onclick="limparFormProduto()">Cancelar edição</button>
    </form>
    <table id="tabelaProdutos"></table>
  </section>

  <section id="tab-clientes" style="display:none">
    <h2>Cadastrar / Editar Cliente</h2>
    <form id="formCliente">
      <input type="hidden" id="clienteRowKey">
      <input id="cNome" placeholder="Nome" required>
      <input id="cEmail" placeholder="Email" required>
      <input id="cTelefone" placeholder="Telefone">
      <input id="cEndereco" placeholder="Endereço">
      <button type="submit">Salvar Cliente</button>
      <button type="button" onclick="limparFormCliente()">Cancelar edição</button>
    </form>
    <table id="tabelaClientes"></table>
  </section>

  <section id="tab-pedidos" style="display:none">
    <h2>Pedidos realizados</h2>
    <table id="tabelaPedidos"></table>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
